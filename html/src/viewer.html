<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEP Viewer</title>
<style>
  :root {
    --bg1: #dfe5ec; --bg2: #8d9aa8;
    --panel: rgba(255,255,255,0.85); --text: #1d2530; --accent: #1f6feb; --border: rgba(0,0,0,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 13px/1.4 system-ui, Segoe UI, sans-serif; color: var(--text); }
  body { background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%); }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #toolbar {
    position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px;
    backdrop-filter: blur(6px); user-select: none;
  }
  #toolbar .sep { width: 1px; background: var(--border); margin: 2px 2px; }
  button {
    font: inherit; padding: 4px 9px; border-radius: 5px; border: 1px solid var(--border);
    background: #fff; color: var(--text); cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  button kbd { font: 10px/1 monospace; opacity: 0.55; margin-left: 4px; }

  #status {
    position: absolute; left: 10px; bottom: 10px; padding: 5px 10px; border-radius: 6px;
    background: var(--panel); border: 1px solid var(--border); white-space: nowrap;
    max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis;
  }
  #status:empty { display: none; }

  #drop {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; pointer-events: none; transition: background 0.15s;
  }
  #drop .box {
    pointer-events: auto; text-align: center; padding: 36px 48px; border: 2px dashed rgba(0,0,0,0.3);
    border-radius: 14px; background: var(--panel); font-size: 16px;
  }
  #drop .box small { display: block; opacity: 0.6; margin-top: 6px; font-size: 12px; }
  #drop .box button { margin-top: 14px; font-size: 14px; padding: 7px 16px; }
  #drop.hidden { display: none; }
  body.dragging #drop { display: flex; background: rgba(31,111,235,0.15); }
  body.dragging #drop .box { border-color: var(--accent); }

  #loading {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; gap: 12px;
    background: rgba(255,255,255,0.4); font-size: 15px;
  }
  #loading.show { display: flex; }
  .spinner { width: 26px; height: 26px; border: 3px solid rgba(0,0,0,0.15); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #error {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%); padding: 10px 14px;
    background: #fde8e8; border: 1px solid #e0a0a0; color: #7a1b1b; border-radius: 8px; display: none; max-width: 80%;
  }
  #error.show { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="toolbar">
  <button id="b-open" title="Ouvrir un fichier STEP (Ctrl+O)">Ouvrir…</button>
  <button id="b-fit" title="Ajuster la vue au modèle (F)">Ajuster<kbd>F</kbd></button>
  <span class="sep"></span>
  <button data-view="iso" title="Vue isométrique (0)">Iso<kbd>0</kbd></button>
  <button data-view="front" title="Face (1)">Face<kbd>1</kbd></button>
  <button data-view="back" title="Arrière (2)">Arrière<kbd>2</kbd></button>
  <button data-view="top" title="Dessus (3)">Dessus<kbd>3</kbd></button>
  <button data-view="bottom" title="Dessous (4)">Dessous<kbd>4</kbd></button>
  <button data-view="left" title="Gauche (5)">Gauche<kbd>5</kbd></button>
  <button data-view="right" title="Droite (6)">Droite<kbd>6</kbd></button>
  <span class="sep"></span>
  <button id="b-edges" title="Arêtes : toutes → vives → aucune (E)">Arêtes : toutes<kbd>E</kbd></button>
  <button id="b-proj" title="Perspective / orthographique (P)">Perspective<kbd>P</kbd></button>
</div>

<div id="drop">
  <div class="box">
    Glissez un fichier STEP ici
    <small>.step / .stp — rotation : clic gauche · panoramique : clic droit ou molette enfoncée · zoom : molette</small>
    <button id="b-open2">Ouvrir un fichier…</button>
  </div>
</div>
<div id="loading"><div class="spinner"></div><span id="loading-text">Lecture du fichier…</span></div>
<div id="error"></div>
<div id="status"></div>
<input type="file" id="file" accept=".step,.stp,.STEP,.STP" hidden>

<!-- Bibliothèques embarquées (injectées par build_html.py) -->
<script type="text/plain" id="src-three">{{THREE}}</script>
<script type="text/plain" id="src-orbit">{{ORBIT}}</script>
<script type="text/plain" id="src-occt">{{OCCT}}</script>
<script type="text/plain" id="src-wasm">{{WASM_B64}}</script>
<script type="text/plain" id="src-selftest">{{SELFTEST_B64}}</script>

<script type="module">
// ---------------------------------------------------------------------------
// Chargement des bibliothèques embarquées via blob URLs (fichier 100 % autonome)
// ---------------------------------------------------------------------------
const src = id => document.getElementById(id).textContent;
const blobUrl = (s, type = 'text/javascript') => URL.createObjectURL(new Blob([s], { type }));

const threeUrl = blobUrl(src('src-three'));
const orbitUrl = blobUrl(src('src-orbit').replace(/from\s+['"]three['"]/g, `from '${threeUrl}'`));
const THREE = await import(threeUrl);
const { OrbitControls } = await import(orbitUrl);

// ---------------------------------------------------------------------------
// Worker de lecture STEP (occt-import-js + calcul des arêtes), hors thread UI
// ---------------------------------------------------------------------------
const WORKER_BODY = `
let occtReady = null;
function packMesh(m) {
  const position = new Float32Array(m.attributes.position.array);
  const normal = m.attributes.normal ? new Float32Array(m.attributes.normal.array) : null;
  const index = new Uint32Array(m.index.array);
  const faces = (m.brep_faces || []).map(f => ({ first: f.first, last: f.last, color: f.color || null }));
  const { all, sharp } = edges(position, index, faces, ${'SHARP_DEG'});
  return { name: m.name || '', color: m.color || null, faces, position, normal, index, edgesAll: all, edgesSharp: sharp };
}
// Arêtes = frontières entre faces B-rep (ou bord libre). "Vives" = sous-ensemble dont l'angle dièdre > seuil.
function edges(pos, idx, faces, sharpDeg) {
  const nv = pos.length / 3, nt = idx.length / 3;
  // fusion des sommets coïncidents (les faces OCCT sont maillées indépendamment)
  const canon = new Int32Array(nv);
  const seen = new Map();
  for (let i = 0; i < nv; i++) {
    const k = pos[3*i].toFixed(4) + ',' + pos[3*i+1].toFixed(4) + ',' + pos[3*i+2].toFixed(4);
    const c = seen.get(k);
    if (c === undefined) { seen.set(k, i); canon[i] = i; } else canon[i] = c;
  }
  const faceOf = new Int32Array(nt).fill(-1);
  faces.forEach((f, fi) => { for (let t = f.first; t <= f.last; t++) faceOf[t] = fi; });
  const nrm = new Float32Array(nt * 3);
  for (let t = 0; t < nt; t++) {
    const a = idx[3*t], b = idx[3*t+1], c = idx[3*t+2];
    const ax = pos[3*b]-pos[3*a], ay = pos[3*b+1]-pos[3*a+1], az = pos[3*b+2]-pos[3*a+2];
    const bx = pos[3*c]-pos[3*a], by = pos[3*c+1]-pos[3*a+1], bz = pos[3*c+2]-pos[3*a+2];
    let x = ay*bz-az*by, y = az*bx-ax*bz, z = ax*by-ay*bx;
    const l = Math.hypot(x, y, z) || 1;
    nrm[3*t] = x/l; nrm[3*t+1] = y/l; nrm[3*t+2] = z/l;
  }
  // clé d'arête -> { f: face du 1er triangle, t: 1er triangle, n: nb d'occurrences, a, b, diff: faces différentes, ang: cos angle }
  const map = new Map();
  for (let t = 0; t < nt; t++) {
    for (let k = 0; k < 3; k++) {
      const i0 = idx[3*t+k], i1 = idx[3*t+(k+1)%3];
      const a = canon[i0], b = canon[i1];
      if (a === b) continue;
      const key = a < b ? a * nv + b : b * nv + a;
      const e = map.get(key);
      if (!e) map.set(key, { f: faceOf[t], t, n: 1, a: i0, b: i1, diff: false, cos: 1 });
      else {
        e.n++;
        if (faceOf[t] !== e.f) e.diff = true;
        const c = nrm[3*t]*nrm[3*e.t] + nrm[3*t+1]*nrm[3*e.t+1] + nrm[3*t+2]*nrm[3*e.t+2];
        if (c < e.cos) e.cos = c;
      }
    }
  }
  const cosLimit = Math.cos(sharpDeg * Math.PI / 180);
  const all = [], sharp = [];
  for (const e of map.values()) {
    const show = e.n === 1 || e.diff;
    if (!show) continue;
    const seg = [pos[3*e.a], pos[3*e.a+1], pos[3*e.a+2], pos[3*e.b], pos[3*e.b+1], pos[3*e.b+2]];
    all.push(...seg);
    if (e.n === 1 || e.cos < cosLimit) sharp.push(...seg);
  }
  return { all: new Float32Array(all), sharp: new Float32Array(sharp) };
}
self.onmessage = async (ev) => {
  const { buffer, wasmBinary, params } = ev.data;
  try {
    if (!occtReady) occtReady = occtimportjs({ wasmBinary });
    const occt = await occtReady;
    const t0 = performance.now();
    const res = occt.ReadStepFile(new Uint8Array(buffer), params);
    if (!res.success) throw new Error('Lecture STEP échouée (fichier invalide ou non supporté).');
    const meshes = res.meshes.map(packMesh);
    const transfer = [];
    for (const m of meshes) { transfer.push(m.position.buffer, m.index.buffer, m.edgesAll.buffer, m.edgesSharp.buffer); if (m.normal) transfer.push(m.normal.buffer); }
    self.postMessage({ ok: true, meshes, root: res.root, ms: performance.now() - t0 }, transfer);
  } catch (err) {
    self.postMessage({ ok: false, error: String(err && err.message || err) });
  }
};
`;

const SHARP_DEG = 20;
let worker = null;
let wasmBinary = null;

async function getWasm() {
  if (wasmBinary) return wasmBinary;
  const gz = await fetch('data:application/octet-stream;base64,' + src('src-wasm').trim()).then(r => r.arrayBuffer());
  const ds = new DecompressionStream('gzip');
  wasmBinary = await new Response(new Blob([gz]).stream().pipeThrough(ds)).arrayBuffer();
  return wasmBinary;
}

function getWorker() {
  if (!worker) {
    const code = src('src-occt') + '\n' + WORKER_BODY.replace('SHARP_DEG', String(SHARP_DEG));
    worker = new Worker(blobUrl(code));
  }
  return worker;
}

async function parseStep(buffer) {
  const wasm = await getWasm();
  const w = getWorker();
  return new Promise((resolve, reject) => {
    w.onmessage = ev => ev.data.ok ? resolve(ev.data) : reject(new Error(ev.data.error));
    w.onerror = ev => { reject(new Error(ev.message || 'Erreur du worker')); worker.terminate(); worker = null; };
    // le binaire WASM est copié (pas transféré) pour pouvoir recréer le worker si besoin
    w.postMessage({ buffer, wasmBinary: wasm.slice(0), params: {
      linearUnit: 'millimeter', linearDeflectionType: 'bounding_box_ratio', linearDeflection: 0.0005, angularDeflection: 0.3
    } }, [buffer]);
  });
}

// ---------------------------------------------------------------------------
// Scène three.js
// ---------------------------------------------------------------------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.autoClear = false;

const scene = new THREE.Scene();
const UP = new THREE.Vector3(0, 0, 1);
let camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
camera.up.copy(UP);
camera.position.set(100, -100, 80);
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.9));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
keyLight.position.set(0.6, 0.8, 1.6);
camera.add(keyLight);                       // éclairage solidaire de la caméra

const controls = new OrbitControls(camera, canvas);
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.PAN };
controls.enableDamping = false;
controls.screenSpacePanning = true;
controls.zoomToCursor = true;
controls.rotateSpeed = 0.9;
controls.addEventListener('change', requestRender);

// Trièdre d'orientation (encart en bas à droite)
const axesScene = new THREE.Scene();
const axesCam = new THREE.OrthographicCamera(-1.6, 1.6, 1.6, -1.6, 0.1, 10);
axesCam.up.copy(UP);
{
  const mk = (dir, color, label) => {
    const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), dir]);
    axesScene.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color })));
    const cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const ctx = cv.getContext('2d'); ctx.font = 'bold 44px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#' + color.toString(16).padStart(6, '0'); ctx.fillText(label, 32, 34);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false }));
    sp.position.copy(dir).multiplyScalar(1.25); sp.scale.set(0.5, 0.5, 1);
    axesScene.add(sp);
  };
  mk(new THREE.Vector3(1, 0, 0), 0xd03030, 'X');
  mk(new THREE.Vector3(0, 1, 0), 0x30a030, 'Y');
  mk(new THREE.Vector3(0, 0, 1), 0x3050d0, 'Z');
}

let model = null;           // THREE.Group du modèle courant
let bounds = { center: new THREE.Vector3(), radius: 50 };
let edgeMode = 'all';       // 'all' | 'sharp' | 'none'
let renderQueued = false;

function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(render);
}

function updateClipping() {
  const dist = camera.position.distanceTo(controls.target);
  const r = bounds.radius;
  camera.near = Math.max((dist - r) * 0.5, r * 1e-4, 1e-3);
  camera.far = dist + r * 6;
  camera.updateProjectionMatrix();
}

function render() {
  renderQueued = false;
  updateClipping();
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setViewport(0, 0, w, h);
  renderer.setScissorTest(false);
  renderer.clear();
  renderer.render(scene, camera);

  // encart trièdre
  const s = Math.min(110, Math.floor(Math.min(w, h) * 0.2));
  const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
  axesCam.position.copy(dir).multiplyScalar(4);
  axesCam.lookAt(0, 0, 0);
  renderer.setViewport(w - s - 8, 8, s, s);
  renderer.setScissor(w - s - 8, 8, s, s);
  renderer.setScissorTest(true);
  renderer.render(axesScene, axesCam);
  renderer.setScissorTest(false);
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  if (camera.isPerspectiveCamera) camera.aspect = w / h;
  else setOrthoFrustum(camera, camera.position.distanceTo(controls.target));
  camera.updateProjectionMatrix();
  requestRender();
}
window.addEventListener('resize', resize);

// ---------------------------------------------------------------------------
// Construction du modèle
// ---------------------------------------------------------------------------
const DEFAULT_COLOR = [0.72, 0.74, 0.76];
const tmpColor = new THREE.Color();
function toLinear(rgb) {
  tmpColor.setRGB(rgb[0], rgb[1], rgb[2], THREE.SRGBColorSpace); // le STEP porte des valeurs sRGB
  return [tmpColor.r, tmpColor.g, tmpColor.b];
}

function buildModel(meshes) {
  const group = new THREE.Group();
  const box = new THREE.Box3();
  let triangles = 0;
  for (const m of meshes) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(m.position, 3));
    g.setIndex(new THREE.BufferAttribute(m.index, 1));
    if (m.normal) g.setAttribute('normal', new THREE.BufferAttribute(m.normal, 3));
    else g.computeVertexNormals();

    // couleurs par sommet : couleur du corps, surchargée par les couleurs de faces
    const nv = m.position.length / 3;
    const colors = new Float32Array(nv * 3);
    const base = toLinear(m.color || DEFAULT_COLOR);
    for (let i = 0; i < nv; i++) { colors[3*i] = base[0]; colors[3*i+1] = base[1]; colors[3*i+2] = base[2]; }
    for (const f of m.faces) {
      if (!f.color) continue;
      const c = toLinear(f.color);
      for (let t = f.first; t <= f.last; t++) for (let k = 0; k < 3; k++) {
        const v = m.index[3*t+k];
        colors[3*v] = c[0]; colors[3*v+1] = c[1]; colors[3*v+2] = c[2];
      }
    }
    g.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.MeshPhongMaterial({
      vertexColors: true, side: THREE.DoubleSide, shininess: 35, specular: 0x333333,
      polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
    });
    const mesh = new THREE.Mesh(g, mat);
    mesh.name = m.name;
    group.add(mesh);
    g.computeBoundingBox();
    box.union(g.boundingBox);
    triangles += m.index.length / 3;

    const lineMat = new THREE.LineBasicMaterial({ color: 0x1a1f26 });
    for (const [key, arr] of [['all', m.edgesAll], ['sharp', m.edgesSharp]]) {
      if (!arr.length) continue;
      const eg = new THREE.BufferGeometry();
      eg.setAttribute('position', new THREE.BufferAttribute(arr, 3));
      const lines = new THREE.LineSegments(eg, lineMat);
      lines.userData.edgeKind = key;
      lines.renderOrder = 1;
      group.add(lines);
    }
  }
  const sphere = new THREE.Sphere();
  box.getBoundingSphere(sphere);
  return { group, center: sphere.center, radius: Math.max(sphere.radius, 1e-3), triangles };
}

function disposeModel() {
  if (!model) return;
  model.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  scene.remove(model);
  model = null;
}

function applyEdgeMode() {
  if (model) model.traverse(o => { if (o.userData.edgeKind) o.visible = o.userData.edgeKind === edgeMode; });
  document.getElementById('b-edges').textContent = { all: 'Arêtes : toutes', sharp: 'Arêtes : vives', none: 'Arêtes : aucune' }[edgeMode];
  document.getElementById('b-edges').insertAdjacentHTML('beforeend', '<kbd>E</kbd>');
  requestRender();
}

// ---------------------------------------------------------------------------
// Caméra : ajustement, vues standard, projection
// ---------------------------------------------------------------------------
function fitAll(direction) {
  const dir = direction ? direction.clone().normalize()
                        : new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
  const fov = THREE.MathUtils.degToRad(40);
  const aspect = canvas.clientWidth / canvas.clientHeight;
  const r = bounds.radius * 1.08;
  const dist = r / Math.sin(fov / 2) / Math.min(1, aspect);
  controls.target.copy(bounds.center);
  camera.position.copy(bounds.center).addScaledVector(dir, dist);
  if (camera.isOrthographicCamera) { camera.zoom = 1; setOrthoFrustum(camera, dist); }
  camera.lookAt(controls.target);
  camera.updateProjectionMatrix();
  controls.update();
  requestRender();
}

const VIEWS = {
  iso: new THREE.Vector3(1, -1, 1), front: new THREE.Vector3(0, -1, 0), back: new THREE.Vector3(0, 1, 0),
  top: new THREE.Vector3(0, 0, 1), bottom: new THREE.Vector3(0, 0, -1), left: new THREE.Vector3(-1, 0, 0), right: new THREE.Vector3(1, 0, 0),
};
function setView(name) {
  const d = VIEWS[name].clone();
  if (name === 'top' || name === 'bottom') d.y = -1e-4;   // évite la singularité de l'axe vertical
  fitAll(d);
}

function setOrthoFrustum(cam, dist) {
  const halfH = dist * Math.tan(THREE.MathUtils.degToRad(40) / 2);
  const aspect = canvas.clientWidth / canvas.clientHeight;
  cam.left = -halfH * aspect; cam.right = halfH * aspect; cam.top = halfH; cam.bottom = -halfH;
}

function toggleProjection() {
  const dist = camera.position.distanceTo(controls.target);
  const pos = camera.position.clone();
  let next;
  if (camera.isPerspectiveCamera) {
    next = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1000);
    setOrthoFrustum(next, dist);
  } else {
    // distance équivalente compte tenu du zoom orthographique courant
    const effDist = dist / camera.zoom;
    next = new THREE.PerspectiveCamera(40, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    pos.copy(controls.target).addScaledVector(pos.sub(controls.target).normalize(), effDist);
  }
  next.up.copy(UP);
  next.position.copy(pos);
  next.add(keyLight);
  scene.remove(camera);
  scene.add(next);
  camera = next;
  controls.object = camera;
  camera.lookAt(controls.target);
  controls.update();
  document.getElementById('b-proj').innerHTML = (camera.isPerspectiveCamera ? 'Perspective' : 'Orthographique') + '<kbd>P</kbd>';
  requestRender();
}

// ---------------------------------------------------------------------------
// Chargement de fichiers
// ---------------------------------------------------------------------------
const loadingEl = document.getElementById('loading');
const errorEl = document.getElementById('error');
const statusEl = document.getElementById('status');
const dropEl = document.getElementById('drop');

function showError(msg) { errorEl.textContent = msg; errorEl.classList.add('show'); setTimeout(() => errorEl.classList.remove('show'), 6000); }

async function loadFile(file) {
  if (!/\.(step|stp)$/i.test(file.name)) { showError(`Format non pris en charge : ${file.name} (attendu .step / .stp)`); return; }
  loadingEl.classList.add('show');
  document.getElementById('loading-text').textContent = `Lecture de ${file.name}…`;
  document.title = `${file.name} — STEP Viewer`;
  try {
    const t0 = performance.now();
    const buffer = await file.arrayBuffer();
    const data = await parseStep(buffer);
    disposeModel();
    const built = buildModel(data.meshes);
    model = built.group;
    bounds = { center: built.center, radius: built.radius };
    scene.add(model);
    applyEdgeMode();
    dropEl.classList.add('hidden');
    setView('iso');
    const total = ((performance.now() - t0) / 1000).toFixed(1).replace('.', ',');
    const rootName = data.root && data.root.name ? ` · ${data.root.name}` : '';
    statusEl.textContent = `${file.name}${rootName} — ${data.meshes.length} corps, ${built.triangles.toLocaleString('fr-FR')} triangles, ${total} s`;
  } catch (err) {
    console.error(err);
    showError(`Impossible de lire ${file.name} : ${err.message}`);
  } finally {
    loadingEl.classList.remove('show');
  }
}

// glisser-déposer
let dragDepth = 0;
window.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
window.addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
window.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
window.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});

// bouton / raccourci d'ouverture
const fileInput = document.getElementById('file');
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); fileInput.value = ''; });
document.getElementById('b-open').onclick = () => fileInput.click();
document.getElementById('b-open2').onclick = () => fileInput.click();
document.getElementById('b-fit').onclick = () => fitAll();
document.getElementById('b-edges').onclick = () => { edgeMode = { all: 'sharp', sharp: 'none', none: 'all' }[edgeMode]; applyEdgeMode(); };
document.getElementById('b-proj').onclick = toggleProjection;
for (const b of document.querySelectorAll('[data-view]')) b.onclick = () => setView(b.dataset.view);
canvas.addEventListener('dblclick', () => fitAll());

window.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key.toLowerCase() === 'o') { e.preventDefault(); fileInput.click(); return; }
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const map = { '0': 'iso', '1': 'front', '2': 'back', '3': 'top', '4': 'bottom', '5': 'left', '6': 'right' };
  if (map[e.key]) setView(map[e.key]);
  else if (e.key === 'f' || e.key === 'F') fitAll();
  else if (e.key === 'e' || e.key === 'E') document.getElementById('b-edges').click();
  else if (e.key === 'p' || e.key === 'P') toggleProjection();
});

resize();
fitAll(VIEWS.iso);
// pré-décompression du WASM en arrière-plan pour un premier chargement plus rapide
getWasm().catch(err => showError('Initialisation du moteur STEP impossible : ' + err.message));

// Auto-test : ouvrir le fichier avec #selftest charge un STEP embarqué et écrit le verdict dans la barre d'état
if (location.hash === '#selftest') {
  (async () => {
    try {
      const gz = await fetch('data:application/octet-stream;base64,' + src('src-selftest').trim()).then(r => r.arrayBuffer());
      const buf = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
      await loadFile(new File([buf], 'selftest.step'));
      const ok = model && model.children.length > 0 && !errorEl.classList.contains('show');
      statusEl.textContent = (ok ? 'SELFTEST OK — ' : 'SELFTEST KO — ') + statusEl.textContent + ' ' + errorEl.textContent;
    } catch (err) { statusEl.textContent = 'SELFTEST KO — ' + err.message; }
  })();
}
</script>
</body>
</html>
